[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shredder-encryptor-cli"
version = "2026.8.0"
description = "A colourful command-line front-end for shredder-encryptor built on top of argparse."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "aiwonderland", email = "quantbit@126.com" },
]
keywords = [
    "cli",
    "argparse",
    "cipher",
    "encoding",
    "shredder-encryptor",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
    "Topic :: Utilities",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/shredder-encryptor/shredder-encryptor-cli"
Repository = "https://github.com/shredder-encryptor/shredder-encryptor-cli"
Issues = "https://github.com/shredder-encryptor/shredder-encryptor-cli/issues"

[project.scripts]
shredder-cli = "shredder_encryptor_cli.main:main"

[tool.setuptools]
include-package-data = true
zip-safe = false
platforms = ["any"]

[tool.setuptools.packages.find]
where = ["."]
include = ["shredder_encryptor_cli*"]

[tool.setuptools.package-data]
"shredder_encryptor_cli" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-ra", "--strict-markers"]
filterwarnings = [
    "error",
]